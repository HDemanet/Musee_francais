```toml
# Configuration Netlify pour le Musée de la 1ère Armée Française

[build]
  # Commande de build (rien pour site statique)
  command = "echo 'Site statique - pas de build'"

  # Dossier à publier
  publish = "public"

  # Dossier des fonctions serverless
  functions = "netlify/functions"

# Redirections pour les Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers CORS pour les Functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Page 404 personnalisée
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
```
